name: Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # permite a Action fazer commit no repo

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar CHANGELOG.md
        run: |
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Últimas alterações do repositório (gerado automaticamente)." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log -n 20 --no-merges --date=short \
            --pretty=format:"- **%ad** – %s (\`%h\`) por %an" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

      - name: Mostrar no resumo da execução
        run: cat CHANGELOG.md >> $GITHUB_STEP_SUMMARY

      - name: Salvar CHANGELOG.md no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: atualiza CHANGELOG [skip ci]"
          git push
