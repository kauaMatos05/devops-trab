name: Release Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - name: Baixar repositório com as tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ver arquivos e tags
        run: |
          echo "=== Arquivos do repositório ==="
          ls -la
          echo "=== Tags que já existem ==="
          git tag --list
